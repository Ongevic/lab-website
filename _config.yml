# ============================================
# LAB WEBSITE TEMPLATE CONFIGURATION
# Replace the placeholder values below with your own lab details.
# ============================================

# Site Settings
name: "Example Lab"
description: "A starter template for research groups, labs, and academic centres."
url: "https://example.github.io"
baseurl: "/lab-website"

# Lab Information
lab:
  name: "ExampleLab"
  full_name: "Example Research Lab"
  tagline: "A clean starting point for your team, projects, and updates"
  department: "Department or School Name"
  university: "University or Institution Name"
  location: "City, Country"
  founded: 2026
  head: "Dr. Example Lead"
  overview:
    intro:
      - "Use this starter site to present your lab, centre, or research group online."
      - "Replace the sample content in the configuration and collection files with your own people, projects, and announcements."
    objectives:
      - "Describe your mission in a short, clear list."
      - "Summarize the kinds of research problems your group works on."
      - "Highlight the methods, data, or collaborations that define your work."
      - "Give visitors a quick sense of why the lab exists and what it contributes."
    activities:
      - "Document the main activities of the group, such as fieldwork, modelling, experiments, or applied partnerships."
      - "Use the research collection to describe major themes, projects, or work packages."
      - "Use the news collection for short updates, grants, publications, workshops, and hiring notices."
      - "Keep this section concise so the home and research pages stay easy to scan."
  activity_sections:
    - title: "Research Theme One"
      paragraphs:
        - "Add a short description of your first research area here."
        - "Explain what questions you study, what methods you use, and why the work matters."
    - title: "Research Theme Two"
      paragraphs:
        - "Add a second theme to show another line of work or a major application area."
        - "You can use these sections to structure interdisciplinary or cross-team activities."
    - title: "Research Theme Three"
      paragraphs:
        - "Use a third block for a complementary topic, platform, or collaboration stream."
        - "If you need more sections, add them here in the configuration."
  projects:
    - "Template Project Alpha"
    - "Template Project Beta"
    - "Template Project Gamma"
  people:
    former_members:
      - name: "Former Member One"
        orcid: ""
      - name: "Former Member Two"
        orcid: ""
  collaborations:
    national:
      - "National partner or institute"
      - "Research network or collaborator"
    international:
      - "International partner or institute"
      - "Global network or collaborator"
  publications:
    - name: "Lead Researcher"
      url: "https://example.org/profile"
    - name: "Senior Researcher"
      url: "https://example.org/profile"

contact:
  email: "lab@example.edu"
  secondary_email: "admin@example.edu"
  phone: "Tel: +00 0000 000000"
  fax: "Fax: +00 0000 000001"
  address: |
    Building Name
    Street Address
    Postal Code City
    Country
  map_link: "https://maps.google.com"

# Social Links
social:
  github: "https://github.com/example"

# Navigation
navigation:
  - title: "Research"
    url: "/research/"
  - title: "People"
    url: "/people/"
  - title: "News"
    url: "/news/"
  - title: "Contact"
    url: "/contact/"

# Theme Colors (CSS custom properties will use these)
colors:
  primary: "#2563eb"
  secondary: "#059669"
  accent: "#dc2626"
  dark: "#1f2937"
  light: "#f9fafb"

# Collections
collections:
  people:
    output: true
    permalink: /people/:name/
  publications:
    output: false
  research:
    output: true
    permalink: /research/:name/
  news:
    output: true
    permalink: /news/:title/

# Build Settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Defaults
defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "people"
    values:
      layout: "person"
  - scope:
      path: ""
      type: "research"
    values:
      layout: "research"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
